<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>To-do Today</title>
  <meta name="theme-color" content="#f6f7f8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="To-do Today">
  <link rel="apple-touch-icon" sizes="180x180" href="https://sam030692.github.io/to-do-ks/todo-today-icon.png?v=3">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://sam030692.github.io/to-do-ks/todo-today-icon.png?v=3">
  <link rel="icon" type="image/png" href="https://sam030692.github.io/to-do-ks/todo-today-icon.png?v=3">
  <link rel="manifest" href="/to-do-ks/manifest.webmanifest?v=3">
  <style>
    html,body{margin:0;width:100%;height:100%;background:#f6f7f8;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    #appFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f6f7f8}
    #fallback{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#f6f7f8}
    .card{width:min(420px,100%);text-align:center;background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:30px 24px;box-shadow:0 12px 35px rgba(15,23,42,.08)}
    .card img{width:120px;height:120px;border-radius:28px;display:block;margin:0 auto 18px}
    .card h1{margin:0 0 8px;font-size:30px;color:#111827}
    .card p{margin:0 0 22px;color:#6b7280;line-height:1.5}
    .card a{display:inline-block;background:#111827;color:#fff;text-decoration:none;font-weight:700;padding:14px 20px;border-radius:14px}
    .hint{display:block;color:#9ca3af;margin-top:18px;font-size:13px;line-height:1.4}
  </style>
</head>
<body>
  <iframe id="appFrame"
    src="https://script.google.com/macros/s/AKfycbyvFR1X1c6tGgdbgPzKEZYmhfZ0U3VVMh6vy01H_0PRxnbkMNuTcZKWD3Jn_QMegZMf/exec"
    title="To-do Today"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin"></iframe>

  <div id="fallback" hidden>
    <div class="card">
      <img src="https://sam030692.github.io/to-do-ks/todo-today-icon.png?v=3" alt="To-do Today icon">
      <h1>To-do Today</h1>
      <p>If Google blocks the embedded sign-in, open the Apps Script version directly once, sign in, then return here.</p>
      <a href="https://script.google.com/macros/s/AKfycbyvFR1X1c6tGgdbgPzKEZYmhfZ0U3VVMh6vy01H_0PRxnbkMNuTcZKWD3Jn_QMegZMf/exec" target="_blank" rel="noopener">Open Apps Script</a>
      <span class="hint">After authorizing, relaunch the Home Screen app.</span>
    </div>
  </div>

  <script>
    const frame=document.getElementById('appFrame');
    const fallback=document.getElementById('fallback');
    let loaded=false;
    frame.addEventListener('load',()=>{ loaded=true; });
    setTimeout(()=>{
      if(!loaded){
        frame.hidden=true;
        fallback.hidden=false;
      }
    },8000);
  </script>
</body>
</html>
