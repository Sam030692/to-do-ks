<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>To-do Today</title>
  <meta name="theme-color" content="#f6f7f8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="To-do Today">
  <link rel="apple-touch-icon" sizes="180x180" href="./todo-today-icon.png">
  <link rel="icon" type="image/png" href="./todo-today-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f6f7f8}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(420px,100%);text-align:center;background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:30px 24px;box-shadow:0 12px 35px rgba(15,23,42,.08)}
    img{width:120px;height:120px;border-radius:28px;display:block;margin:0 auto 18px}
    h1{margin:0 0 8px;font-size:30px}
    p{margin:0 0 22px;color:#6b7280;line-height:1.5}
    a{display:inline-block;background:#111827;color:#fff;text-decoration:none;font-weight:700;padding:14px 20px;border-radius:14px}
    small{display:block;color:#9ca3af;margin-top:18px;line-height:1.4}
  </style>
</head>
<body>
  <main>
    <img src="./todo-today-icon.png" alt="To-do Today icon">
    <h1>To-do Today</h1>
    <p>Your private Google-powered task app.</p>
    <a href="https://script.google.com/macros/s/AKfycbyvFR1X1c6tGgdbgPzKEZYmhfZ0U3VVMh6vy01H_0PRxnbkMNuTcZKWD3Jn_QMegZMf/exec">Open To-do Today</a>
    <small>On iPhone, use Share → Add to Home Screen from this page.</small>
  </main>
  <script>
    const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (standalone) {
      setTimeout(() => location.replace("https://script.google.com/macros/s/AKfycbyvFR1X1c6tGgdbgPzKEZYmhfZ0U3VVMh6vy01H_0PRxnbkMNuTcZKWD3Jn_QMegZMf/exec"), 250);
    }
  </script>
</body>
</html>
